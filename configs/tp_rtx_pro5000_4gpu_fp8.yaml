# RTX PRO 5000 四卡 TP FP8 主测试配置 —— 本仓库唯一默认口径。
#
# 从 moe_bench 上一级目录加载：
#   python -m moe_bench.bench \
#     --config moe_bench/configs/tp_rtx_pro5000_4gpu_fp8.yaml \
#     --distributed --scheme tktp
#
# tools/ 下的专用脚本（run_tktp.py / time_tp_stages.py）直接读这份配置，
# 命令行只做最小覆盖并把覆盖项打印出来。A/B 实验的覆盖项必须同时记录到
# 结果目录和 HANDOFF.md，不要静默改动这份文件。

# ---- Model / weight shape ----
hidden_size: 4096
intermediate_size: 3072
num_experts: 64
topk: 8

# ---- Parallelism ----
parallel_mode: tp
world_size: 4

# ---- Precision ----
precision: fp8
block_shape: [128, 128]

# ---- Workload ----
# 正式口径为每个 rank 512 tokens，四卡总 token 数为 2048。
num_tokens: [512]

# ---- Routing / load balance ----
routing:
  distribution: balanced
  skew_alpha: 1.0
  num_active_experts: null

# ---- Distributed ----
distributed: true
all2all_backend: allgather_reducescatter

# ---- Timing ----
warmup_iters: 20
# 历史轮多用 warmup=5 并额外测 T=1024/30 iters；主配置采用正式 T=512 口径
# 和更充分的 warmup=20，因此历史数字与这份配置的结果不可直接对比。
bench_iters: 50
use_cuda_graph: false
seed: 0

# ---- Correctness ----
# 主配置默认开启验证；历史性能步骤通过 --no-verify 覆盖，并另跑 10 次正确性。
verify: true
verify_atol: null
verify_rtol: null

# ---- Output ----
device: cuda
output_json: null
