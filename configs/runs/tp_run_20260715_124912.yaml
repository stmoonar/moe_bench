  - 性能步骤使用 no-verify；正确性由独立的 correctness cases 检查。
  - 本轮 serial 使用 vLLM 默认 MoE config，不是 RTX PRO 5000 调优配置。
  - 日志中 Triton 导入失败，因此复现时必须同时核对实际 kernel 路径。
  - 本轮卡组为 0,1,2,3，不是当前 AGENTS.md 推荐的间隔卡组。
